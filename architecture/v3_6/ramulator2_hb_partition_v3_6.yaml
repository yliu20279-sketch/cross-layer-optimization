metadata:
  schema_version: 3.6
  physical_interpretation: HB-DRAM partition; LPDDR5 command timing proxy only
  instances: 16
  capacity_bytes_per_instance: 536870912
  transaction_bytes: 32
  tck_ns: 1.25
  fixed_client: true
  clients_per_instance: 1
  decoded_banks_per_partition: 16
  logical_bank_projection: decoded_bank_mod_4
  deepstack_sector_bytes: 256
  cross_logical_request_multi_outstanding: true
  bandwidth_floor_policy: per-partition serialized service reservation; Ramulator requests may overlap
